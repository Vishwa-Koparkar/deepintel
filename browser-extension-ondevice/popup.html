<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DeepIntel On-device URL Check</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <h1>Check a URL</h1>
      <p class="privacy">The URL stays in this extension. It is not opened or sent to a server.</p>
      <p id="engine-status" role="status" aria-live="polite">Loading local model…</p>
      <form id="check-form">
        <label for="url">Website address</label>
        <input id="url" name="url" type="text" inputmode="url" autocomplete="url" placeholder="example.com/login" required>
        <button id="check-button" type="submit" disabled>Check URL</button>
      </form>
      <p id="error" class="error" role="alert" hidden></p>
      <section id="result" aria-live="polite" hidden>
        <h2 id="verdict"></h2>
        <p id="risk"></p>
        <p id="decider" class="muted"></p>
        <h3>Signals</h3>
        <ul id="reasons"></ul>
      </section>
      <p class="footnote">Prototype results can be wrong. Use care with unfamiliar links.</p>
    </main>
    <script src="runtime/ort.wasm.min.js"></script>
    <script src="features.js"></script>
    <script src="engine.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
