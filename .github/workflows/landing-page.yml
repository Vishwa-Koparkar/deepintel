name: Deploy landing page
on:
  push:
    branches: [main]
    paths: ['website/**', '.github/workflows/landing-page.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check walkthrough
        run: node website/app.test.cjs
      - uses: actions/configure-pages@v5
      - name: Prepare public files
        run: |
          mkdir -p /tmp/deepintel-public
          cp website/index.html website/style.css website/app.js /tmp/deepintel-public/
          cp -R website/assets /tmp/deepintel-public/assets
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/deepintel-public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
